services:
  ciabattabot:
    image: ciabattabot:latest
    build:
      dockerfile: Dockerfile
      context: .
    environment:
      JAVA_OPTS: "-Xmx512m"
      CIABATTA_BOT_COMMAND_PREFIX:
      CIABATTA_BOT_DISCORD_BOT_TOKEN:
      CIABATTA_BOT_YOUTUBE_OAUTH_REFRESH_TOKEN:
      CIABATTA_BOT_ENABLE_YOUTUBE_OAUTH:
